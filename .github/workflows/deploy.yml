name: Test and Deploy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
# Least privilege: the workflow token is read-only by default and only the
# deploy job is granted contents: write, because it is the only job that pushes
# (dist -> branch gh-pages). pages: write and id-token: write are gone; they
# were required by actions/deploy-pages@v4, which #43 replaced with
# peaceiris/actions-gh-pages. Naming any permission here already set every
# unnamed scope to none, so this does not tighten anything except contents.
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm test
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_AI_TRACE_ENABLED: ${{ vars.VITE_AI_TRACE_ENABLED }}
        run: npm run build
      - name: Verify release artifact
        run: npm run test:release
      - name: Upload dist for deploy job
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist
          retention-days: 2
  preview-smoke:
    needs: test-build
    runs-on: ubuntu-latest
    # Browser binaries + OS libs come from the Playwright image — no
    # `playwright install --with-deps` / apt-get in the job (that path was
    # timing out at 15m on azure.archive.ubuntu.com before tests started).
    # Image tag must stay aligned with @playwright/test major.minor in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.54.2-jammy
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm install
      - name: Check Edge Function in Deno
        run: deno check supabase/functions/explain-trace/index.ts
      - name: Run isolated Edge Function smoke environment
        run: npm run test:edge-smoke
      - name: Build production preview
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_AI_TRACE_ENABLED: ${{ vars.VITE_AI_TRACE_ENABLED }}
        run: npm run build
      - name: Run browser preview smoke test
        run: npm run test:preview
      - name: Upload retained UI screenshots
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/**/visual-evidence-*.png
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: preview-smoke-failure
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [test-build, preview-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The only job that writes to the repository: it pushes dist to gh-pages.
    permissions:
      contents: write
    steps:
      - name: Download site-dist
        uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: dist
      # Option B: publish dist to branch gh-pages.
      # Bypasses actions/deploy-pages@v4 which hard-caps timeout at 600000ms
      # (log: "timeout value is greater than the allowed maximum - timeout set to the maximum of 600000 milliseconds").
      # OWNER MUST set Settings → Pages → Source = Deploy from a branch → gh-pages / (root)
      # before or right after merge, or the site will not update.
      - name: Deploy dist to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          publish_branch: gh-pages
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
