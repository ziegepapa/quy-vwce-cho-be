name: H4 H5 Evidence

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "supabase/**"
      - "docs/LONG_TERM_READINESS.md"
      - "docs/H4-H5-CLOSURE-PLAN.md"
      - "docs/EVIDENCE_REFRESH_2026-10-22.md"
      - "scripts/h4-rls-behavioral.mjs"
      - "scripts/h4-rls-catalog-check.sql"
      - "scripts/h5-migration-guard.mjs"
      - ".github/workflows/h4-h5-evidence.yml"

concurrency:
  group: h4-h5-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  h5-guard:
    name: H5 migration order guard
    runs-on: ubuntu-latest
    env:
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run migration numbering guard
        run: node scripts/h5-migration-guard.mjs

  h4-h5-local:
    name: H4 behavioral RLS + H5 blank install
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies (supabase-js for H4 client)
        run: npm ci

      - name: Setup Supabase CLI (pinned)
        uses: supabase/setup-cli@v3
        with:
          version: 2.119.0

      - name: Run H5 migration numbering guard
        run: node scripts/h5-migration-guard.mjs

      - name: Start local Supabase (disposable)
        run: |
          set -euo pipefail
          if [ ! -f supabase/config.toml ]; then
            supabase init
          fi
          supabase start -x studio,imgproxy,logflare,vector,supavisor
          supabase status -o env > "$RUNNER_TEMP/supabase.env"
          echo "Supabase status environment captured in runner temp storage; credential contents withheld."

      - name: Apply ordered migrations from a clean local database
        run: |
          set -euo pipefail
          supabase db reset --yes
          node --input-type=module -e '
            import fs from "node:fs";
            import { createHash } from "node:crypto";
            import { execFileSync } from "node:child_process";
            const path = "h5-migration-evidence.json";
            const evidence = JSON.parse(fs.readFileSync(path, "utf8"));
            const schemaSha256 = createHash("sha256")
              .update(fs.readFileSync("supabase/schema.sql")).digest("hex");
            evidence.blankInstall = {
              result: "PASS",
              command: "supabase db reset --yes",
              target: "disposable-supabase-local",
              sourceCommit: process.env.SOURCE_COMMIT ?? process.env.GITHUB_SHA ?? null,
              workflowRunId: process.env.GITHUB_RUN_ID ?? null,
              supabaseCliVersion: execFileSync("supabase", ["--version"], { encoding: "utf8" }).trim(),
              schemaSqlSha256: schemaSha256,
              checkedAt: new Date().toISOString()
            };
            fs.writeFileSync(path, JSON.stringify(evidence, null, 2) + "\n", { mode: 0o600 });
          '

      - name: Verify RLS catalog and policy prerequisites
        run: |
          set -euo pipefail
          # These are the documented default credentials/port for this disposable
          # local stack only; do not replace them with a hosted Supabase URL.
          export DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          node --input-type=module -e '
            const u = new URL(process.env.DB_URL ?? "");
            if (u.hostname !== "127.0.0.1" ||
                u.protocol !== "postgresql:" || u.port !== "54322" ||
                u.username !== "postgres" || u.password !== "postgres") {
              throw new Error("H4 catalog check refuses a non-local database target");
            }
          '
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f scripts/h4-rls-catalog-check.sql
          node --input-type=module -e '
            import fs from "node:fs";
            const evidence = {
              schemaVersion: 1,
              kind: "H4_RLS_CATALOG",
              target: "disposable-supabase-local",
              sourceCommit: process.env.SOURCE_COMMIT ?? process.env.GITHUB_SHA ?? null,
              workflowRunId: process.env.GITHUB_RUN_ID ?? null,
              generatedAt: new Date().toISOString(),
              result: "PASS",
              assertions: ["all six protected tables have RLS enabled", "required owner-scoped policies are present"]
            };
            fs.writeFileSync("h4-catalog-evidence.json", JSON.stringify(evidence, null, 2) + "\\n", { mode: 0o600 });
          '

      - name: Export local keys for H4 (job-local only)
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          echo "::add-mask::$ANON_KEY"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      - name: H4 behavioral matrix
        run: node scripts/h4-rls-behavioral.mjs

      - name: Stop local stack
        if: always()
        run: supabase stop --no-backup || true

      - name: Upload redacted H4/H5 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h4-h5-evidence-${{ github.run_id }}
          path: |
            h4-evidence.json
            h4-catalog-evidence.json
            h5-migration-evidence.json
          if-no-files-found: ignore
          retention-days: 14
