name: Production Health
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-health
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify production shell, PWA and quote feeds
        env:
          BASE_URL: https://ziegepapa.github.io/quy-vwce-cho-be/
          MAX_QUOTE_AGE_DAYS: "7"
        run: npm run verify:production
