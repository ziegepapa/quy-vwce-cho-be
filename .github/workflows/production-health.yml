name: Production Health
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-health
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Verify production shell, PWA and quote feeds
        env:
          BASE_URL: https://ziegepapa.github.io/quy-vwce-cho-be/
          MAX_QUOTE_AGE_DAYS: "7"
        run: npm run verify:production
  # Production Health v2: headless Playwright smoke of the real UI routes.
  # Catches UI-level breakage (blank renders, sheet/modal regressions,
  # uncaught errors) that the HTTP-level verify above cannot see.
  route-smoke:
    runs-on: ubuntu-latest
    # Browsers + OS libs preinstalled — same image as CI preview-smoke,
    # so we never run `playwright install --with-deps` / apt here either.
    # Image tag must match the pinned @playwright/test version (1.65.1).
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-jammy
      options: --ipc=host
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm ci
      - name: Smoke production UI routes (headless)
        env:
          BASE_URL: https://ziegepapa.github.io/quy-vwce-cho-be/
          SCREENSHOT_DIR: /tmp/prod-route-smoke
        run: npm run verify:production-routes
      - name: Upload route failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: production-route-failure-${{ github.run_id }}
          path: /tmp/prod-route-smoke/
          if-no-files-found: ignore
          retention-days: 14

  # Reuses Production Health, NOT a second financial monitor.
  # The GET heartbeat is protected by a separate read-only token.
  # ntfy is an independent channel; Resend is never used here.
  # Defaults to unarmed until the owner separately approves all secrets/variables.
  guardian-watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Check Guardian heartbeat, report outage to ntfy if armed
        env:
          GUARDIAN_WATCHDOG_ENABLED: ${{ vars.GUARDIAN_WATCHDOG_ENABLED }}
          GUARDIAN_WATCHDOG_URL: ${{ vars.GUARDIAN_WATCHDOG_URL }}
          GUARDIAN_WATCHDOG_SECRET: ${{ secrets.GUARDIAN_WATCHDOG_SECRET }}
          GUARDIAN_NTFY_URL: ${{ secrets.GUARDIAN_NTFY_URL }}
          GUARDIAN_NTFY_TOKEN: ${{ secrets.GUARDIAN_NTFY_TOKEN }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: node scripts/guardian/production-watchdog.mjs
