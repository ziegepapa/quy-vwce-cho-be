name: Update VWCE price

on:
  workflow_dispatch:
  schedule:
    # 17:30 UTC Mon-Fri = 19:30 Berlin in summer / 18:30 in winter.
    # Both are after the registry's 18:00 local closed-session gate, while
    # publishing one hour earlier than the previous 18:30 UTC slot.
    - cron: "30 17 * * 1-5"
    # 06:00 UTC Tue-Sat: catch-up for a missed evening run. GitHub schedules are
    # best-effort and are dropped entirely when the queue is loaded, with no
    # make-up run, so a single daily slot means one skipped run leaves the feed
    # two sessions stale. This run still resolves the last CLOSED session, so it
    # never invents an intraday price, and decideQuoteWrite makes it a no-op
    # whenever the evening run already wrote the same economics.
    - cron: "0 6 * * 2-6"

permissions:
  actions: write
  contents: write

concurrency:
  group: update-vwce-price
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm ci

      - name: Price unit tests
        run: npm run test:price

      - name: Fetch and update multi-asset quote feed
        run: node scripts/update-quotes.mjs

      - name: Commit and push if economic price data changed
        id: quote_commit
        run: |
          set -euo pipefail
          QUOTES_PATH="public/data/quotes.json"
          LEGACY_PATH="public/data/vwce-price.json"
          HISTORY_PATH="public/data/price-history/IE00BK5BQT80.json"

          if [ ! -f "$QUOTES_PATH" ]; then
            echo "quotes.json missing after update script"
            exit 1
          fi
          if [ ! -f "$LEGACY_PATH" ]; then
            echo "vwce-price.json missing after update script"
            exit 1
          fi

          # Snapshot generated files outside the worktree before any git reset/rebase.
          # History file may not exist on first cron run (|| true handles that).
          cp "$QUOTES_PATH" "$RUNNER_TEMP/quotes.json"
          cp "$LEGACY_PATH" "$RUNNER_TEMP/vwce-price.json"
          cp "$HISTORY_PATH" "$RUNNER_TEMP/price-history-vwce.json" 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Clean index/worktree so pull --rebase cannot conflict with staged changes
          git reset --hard HEAD
          git pull --rebase origin main

          # Restore generated files after rebase
          mkdir -p public/data public/data/price-history
          cp "$RUNNER_TEMP/quotes.json" "$QUOTES_PATH"
          cp "$RUNNER_TEMP/vwce-price.json" "$LEGACY_PATH"
          # Restore history only if the script wrote one (VWCE quote was successful)
          if [ -f "$RUNNER_TEMP/price-history-vwce.json" ]; then
            cp "$RUNNER_TEMP/price-history-vwce.json" "$HISTORY_PATH"
          fi

          git add -- "$QUOTES_PATH" "$LEGACY_PATH"
          # Stage history file only if it was written and differs from HEAD
          if [ -f "$HISTORY_PATH" ]; then
            git add -- "$HISTORY_PATH"
          fi

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No economic quote changes"
            exit 0
          fi

          # Guard: only the three known data files may be staged.
          # Any extra file signals an unintended side-effect.
          UNEXPECTED=$(git diff --cached --name-only | grep -vxF "$QUOTES_PATH" | grep -vxF "$LEGACY_PATH" | grep -vxF "$HISTORY_PATH" || true)
          if [ -n "$UNEXPECTED" ]; then
            echo "Unexpected staged files:"
            echo "$UNEXPECTED"
            exit 1
          fi

          git commit -m "chore(data): update quotes.json, VWCE mirror, and price history"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger test and Pages deploy for updated feed
        if: steps.quote_commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
