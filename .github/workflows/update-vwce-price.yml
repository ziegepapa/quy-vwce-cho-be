name: Update VWCE price

on:
  workflow_dispatch:
  schedule:
    # 18:30 UTC Mon–Fri ≈ after Xetra close in summer; still after 18:00 Berlin in winter
    - cron: "30 18 * * 1-5"

permissions:
  actions: write
  contents: write

concurrency:
  group: update-vwce-price
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm install

      - name: Price unit tests
        run: npm run test:price

      - name: Fetch and update multi-asset quote feed
        run: node scripts/update-quotes.mjs

      - name: Commit and push if economic price data changed
        id: quote_commit
        run: |
          set -euo pipefail
          QUOTES_PATH="public/data/quotes.json"
          LEGACY_PATH="public/data/vwce-price.json"
          if [ ! -f "$QUOTES_PATH" ]; then
            echo "quotes.json missing after update script"
            exit 1
          fi
          if [ ! -f "$LEGACY_PATH" ]; then
            echo "vwce-price.json missing after update script"
            exit 1
          fi

          # Snapshot generated JSON outside the worktree before any git reset/rebase
          cp "$QUOTES_PATH" "$RUNNER_TEMP/quotes.json"
          cp "$LEGACY_PATH" "$RUNNER_TEMP/vwce-price.json"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Clean index/worktree so pull --rebase cannot conflict with staged changes
          git reset --hard HEAD
          git pull --rebase origin main

          # Restore generated files after rebase
          mkdir -p public/data
          cp "$RUNNER_TEMP/quotes.json" "$QUOTES_PATH"
          cp "$RUNNER_TEMP/vwce-price.json" "$LEGACY_PATH"

          git add -- "$QUOTES_PATH" "$LEGACY_PATH"
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No economic quote changes"
            exit 0
          fi

          STAGED=$(git diff --cached --name-only | sort)
          EXPECTED=$(printf '%s\n' "$LEGACY_PATH" "$QUOTES_PATH" | sort)
          if [ "$STAGED" != "$EXPECTED" ]; then
            echo "Unexpected staged files:"
            echo "$STAGED"
            exit 1
          fi

          git commit -m "chore(data): update quotes.json and VWCE legacy mirror"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger test and Pages deploy for updated feed
        if: steps.quote_commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
