name: Update VWCE price

on:
  workflow_dispatch:
  schedule:
    # 18:30 UTC Mon–Fri ≈ after Xetra close in summer; still after 18:00 Berlin in winter
    - cron: "30 18 * * 1-5"

permissions:
  contents: write

concurrency:
  group: update-vwce-price
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm install

      - name: Price unit tests
        run: npm run test:price

      - name: Fetch and update price file
        run: node scripts/update-vwce-price.mjs

      - name: Guard — only price file may change
        id: diff
        run: |
          set -euo pipefail
          git add public/data/vwce-price.json || true
          CHANGED=$(git diff --cached --name-only)
          if [ -z "${CHANGED}" ]; then
            echo "No new closed Xetra price"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          EXTRA=$(git diff --name-only | grep -v '^public/data/vwce-price.json$' || true)
          if [ -n "${EXTRA}" ]; then
            echo "Unexpected working tree changes:"
            echo "${EXTRA}"
            exit 1
          fi
          CACHED_EXTRA=$(git diff --cached --name-only | grep -v '^public/data/vwce-price.json$' || true)
          if [ -n "${CACHED_EXTRA}" ]; then
            echo "Unexpected staged files:"
            echo "${CACHED_EXTRA}"
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          # re-check only price file after rebase
          git add public/data/vwce-price.json
          if git diff --cached --quiet; then
            echo "No change after rebase"
            exit 0
          fi
          git commit -m "chore(data): update VWCE Xetra closed price"
          git push origin HEAD:main
