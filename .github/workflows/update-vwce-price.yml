name: Update VWCE price

on:
  workflow_dispatch:
  schedule:
  # 17:30 UTC Mon-Fri = 19:30 Berlin in summer / 18:30 in winter.
  # Primary evening run after Xetra close.
  - cron: "30 17 * * 1-5"
  # 20:30 UTC Mon-Fri = 22:30 Berlin in summer / 21:30 in winter.
  # Second evening attempt: GitHub's scheduler is best-effort and has
  # dropped or mistimed the 17:30 slot (seen 2026-10-05/06).
  # decideQuoteWrite keeps this a no-op if the first run already wrote.
  - cron: "30 20 * * 1-5"
  # 06:00 UTC Tue-Sat: catch-up for a missed evening run. (giữ nguyên phần comment cũ)
  - cron: "0 6 * * 2-6"

# Least privilege: every write (branch push, PR create, auto-merge) goes
# through the PRICE_BOT_TOKEN PAT. Events triggered by GITHUB_TOKEN do not
# start new workflow runs, so a PR opened with GITHUB_TOKEN would never
# receive the required test-build check and auto-merge would hang forever.
# PRICE_BOT_TOKEN must be a fine-grained PAT scoped to this repo with
# Contents: read+write and Pull requests: read+write.
permissions:
  contents: read

concurrency:
  group: update-vwce-price
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Guard bot token present
        env:
          PRICE_BOT_TOKEN: ${{ secrets.PRICE_BOT_TOKEN }}
        run: |
          if [ -z "$PRICE_BOT_TOKEN" ]; then
            echo "::error::Repository secret PRICE_BOT_TOKEN is not set. Create a fine-grained PAT (this repo only; Contents: read+write, Pull requests: read+write) and add it as the PRICE_BOT_TOKEN secret."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.PRICE_BOT_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install
        run: npm ci

      - name: Price unit tests
        run: npm run test:price

      - name: Fetch and update multi-asset quote feed
        run: node scripts/update-quotes.mjs

      - name: Commit to price branch and open auto-merge PR
        id: quote_pr
        env:
          GH_TOKEN: ${{ secrets.PRICE_BOT_TOKEN }}
        run: |
          set -euo pipefail
          QUOTES_PATH="public/data/quotes.json"
          LEGACY_PATH="public/data/vwce-price.json"
          HISTORY_PATH="public/data/price-history/IE00BK5BQT80.json"

          if [ ! -f "$QUOTES_PATH" ]; then
            echo "quotes.json missing after update script"
            exit 1
          fi
          if [ ! -f "$LEGACY_PATH" ]; then
            echo "vwce-price.json missing after update script"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # One branch per UTC date, so the 06:00 catch-up run reuses (and
          # updates) the evening run's PR instead of opening a duplicate.
          BRANCH="chore/price-$(date -u +%F)"
          git checkout -B "$BRANCH"

          git add -- "$QUOTES_PATH" "$LEGACY_PATH"
          # Stage history file only if it was written and differs from HEAD
          if [ -f "$HISTORY_PATH" ]; then
            git add -- "$HISTORY_PATH"
          fi

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No economic quote changes"
            exit 0
          fi

          # Guard: only the three known data files may be staged.
          # Any extra file signals an unintended side-effect.
          UNEXPECTED=$(git diff --cached --name-only | grep -vxF "$QUOTES_PATH" | grep -vxF "$LEGACY_PATH" | grep -vxF "$HISTORY_PATH" || true)
          if [ -n "$UNEXPECTED" ]; then
            echo "Unexpected staged files:"
            echo "$UNEXPECTED"
            exit 1
          fi

          git commit -m "chore(data): update quotes.json, VWCE mirror, and price history"
          git push -u origin "$BRANCH"

          if gh pr view "$BRANCH" --json number --jq .number >/dev/null 2>&1; then
            echo "PR already open for $BRANCH; branch updated"
          else
            gh pr create \
              --base main --head "$BRANCH" \
              --title "chore(data): update VWCE quotes $(date -u +%F)" \
              --body "Automated daily price update (VWCE close + mirrors). Data-only change, generated and self-checked by the Update VWCE price workflow. Auto-merge is enabled: it merges only after the required CI checks pass, which then triggers the normal test + Pages deploy."
          fi

          # Merge once the required checks pass. The PR is opened with the PAT
          # (not GITHUB_TOKEN) so that CI actually runs on it.
          gh pr merge "$BRANCH" --auto --squash
          echo "changed=true" >> "$GITHUB_OUTPUT"
