name: one-shot-pdf-import-dock

on:
  push:
    branches:
      - fix/p0-transactions-pdf-import-dock

permissions:
  contents: write

jobs:
  patch-and-push:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/p0-transactions-pdf-import-dock
          fetch-depth: 0

      - name: Apply minimal PDF import dock fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          tx = Path('src/pages/Transactions.tsx')
          s = tx.read_text()
          old = '''    document.documentElement.classList.toggle("tx-filter-open", filterSheetOpen);\n    document.body.classList.toggle("tx-filter-open", filterSheetOpen);\n    if (dock) {\n      dock.classList.toggle("is-hidden", filterSheetOpen);\n      dock.toggleAttribute("inert", filterSheetOpen);\n      dock.setAttribute("aria-hidden", String(filterSheetOpen));\n    }'''
          new = '''    const overlayOpen = filterSheetOpen || pdfToolsOpen;\n    document.documentElement.classList.toggle("tx-filter-open", filterSheetOpen);\n    document.body.classList.toggle("tx-filter-open", filterSheetOpen);\n    document.documentElement.classList.toggle("tx-import-open", pdfToolsOpen);\n    document.body.classList.toggle("tx-import-open", pdfToolsOpen);\n    if (dock) {\n      dock.classList.toggle("is-hidden", overlayOpen);\n      dock.toggleAttribute("inert", overlayOpen);\n      dock.setAttribute("aria-hidden", String(overlayOpen));\n    }'''
          assert old in s, 'Transactions overlay block not found'
          s = s.replace(old, new, 1)
          old2 = '''      document.documentElement.classList.remove("tx-filter-open");\n      document.body.classList.remove("tx-filter-open");\n      const currentDock = document.querySelector(".bottom-dock");\n      currentDock?.classList.remove("is-hidden");\n      currentDock?.removeAttribute("inert");\n      currentDock?.removeAttribute("aria-hidden");\n    };\n  }, [filterSheetOpen]);'''
          new2 = '''      document.documentElement.classList.remove("tx-filter-open");\n      document.body.classList.remove("tx-filter-open");\n      document.documentElement.classList.remove("tx-import-open");\n      document.body.classList.remove("tx-import-open");\n      const currentDock = document.querySelector(".bottom-dock");\n      currentDock?.classList.remove("is-hidden");\n      currentDock?.removeAttribute("inert");\n      currentDock?.removeAttribute("aria-hidden");\n    };\n  }, [filterSheetOpen, pdfToolsOpen]);'''
          assert old2 in s, 'Transactions overlay cleanup block not found'
          s = s.replace(old2, new2, 1)
          tx.write_text(s)

          css = Path('src/styles/demo-v10-transactions.css')
          c = css.read_text()
          c += '''\n\n/* TRANSACTIONS-PDF-IMPORT-DOCK-2026: make the PDF importer a true mobile sheet above the dock. */\n@media (max-width: 899px) {\n  .tx-wrap {\n    padding-bottom: max(136px, calc(96px + env(safe-area-inset-bottom, 0px)));\n  }\n\n  .tx-wrap .tx-import-tools[open] {\n    position: fixed;\n    z-index: var(--z-sheet, 80);\n    top: max(12px, env(safe-area-inset-top, 0px));\n    right: auto;\n    bottom: max(12px, env(safe-area-inset-bottom, 0px));\n    left: 50%;\n    width: min(calc(100vw - 24px), 420px);\n    max-height: 82dvh;\n    overflow-y: auto;\n    overscroll-behavior: contain;\n    transform: translateX(-50%);\n    box-sizing: border-box;\n  }\n\n  html.tx-import-open,\n  body.tx-import-open {\n    overflow: hidden;\n    overscroll-behavior: none;\n  }\n\n  html.tx-import-open .bottom-dock,\n  html.tx-import-open .app-shell::after {\n    pointer-events: none !important;\n    visibility: hidden;\n    opacity: 0;\n  }\n}\n'''
          css.write_text(c)

          e2e = Path('tests/preview.e2e.ts')
          t = e2e.read_text()
          marker = '''test("mobile Settings keeps P40 plan mechanics in a sheet and all tab actions reachable without overflow", async ({ page }) => {'''
          test_block = '''test("mobile Transactions keeps PDF import reachable above the dock", async ({ page }) => {\n  await page.setViewportSize(iphone13Viewport);\n  const { localVaultEntry } = await openPrivateVaultEntry(page);\n  test.skip(!(await localVaultEntry.isVisible()), "requires the local-only preview entry");\n\n  await page.goto("./#/transactions", { waitUntil: "networkidle" });\n  const importSummary = page.locator(".tx-import-tools > summary");\n  await expect(importSummary).toBeVisible();\n  await importSummary.click();\n\n  const importButton = page.getByRole("button", { name: "Nhập hóa đơn hoặc sao kê Depot", exact: true });\n  await expect(importButton).toBeVisible();\n  await expect(page.locator(".bottom-dock")).toHaveClass(/is-hidden/);\n  await expect.poll(() => page.evaluate(() => {\n    const button = document.querySelector(".import-review > button") as HTMLElement | null;\n    const dock = document.querySelector(".bottom-dock") as HTMLElement | null;\n    if (!button) return false;\n    const rect = button.getBoundingClientRect();\n    if (rect.top < 0 || rect.bottom > window.innerHeight) return false;\n    if (!dock) return true;\n    const dockRect = dock.getBoundingClientRect();\n    return dock.classList.contains("is-hidden") || rect.bottom < dockRect.top - 8;\n  })).toBe(true);\n\n  await importSummary.click();\n});\n\n'''
          assert marker in t, 'Transactions preview test insertion marker not found'
          t = t.replace(marker, test_block + marker, 1)
          e2e.write_text(t)
          PY

      - name: Validate and test
        shell: bash
        run: |
          npm ci
          npm test
          npm run build
          npx playwright install --with-deps chromium
          npx playwright test tests/preview.e2e.ts --project=chromium --grep "mobile Transactions keeps PDF import reachable above the dock"

      - name: Commit final code only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Transactions.tsx src/styles/demo-v10-transactions.css tests/preview.e2e.ts .github/workflows/_one-shot-pdf-import-dock.yml
          git rm .github/workflows/_one-shot-pdf-import-dock.yml
          git commit -m "fix(transactions): keep PDF import above bottom dock"
          git push origin HEAD:fix/p0-transactions-pdf-import-dock

      - name: Stop after one shot
        run: echo "One-shot patch pushed; workflow file removed from the branch."